<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DigiVal — CKEditor 5 + Equation Editor</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/48.0.1/ckeditor5.css" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin></script>
    <script type="module" src="./digival-equation-editor.js"></script>
  </head>
  <body>

    <div class="page-wrap">
      <header class="page-header">
        <span class="page-logo">DigiVal</span>
        <span class="page-subtitle">Rich Text Editor + Equation Editor Integration</span>
      </header>
      <div class="editor-shell">
        <div id="editor"></div>
      </div>
      <div class="page-hint">
        💡 Click <strong>ƒ(x)</strong> in the toolbar to insert a formula.
        &nbsp;·&nbsp; <strong>Double-click</strong> any inserted equation to edit it.
      </div>
    </div>

    <!--
      The equation editor component manages its own dialog shell internally
      (overlay, drag handle, minimize / maximize, Insert / Cancel).
      No extra HTML needed here.
    -->
    <digival-equation-editor id="dve-editor"></digival-equation-editor>

    <script src="https://cdn.ckeditor.com/ckeditor5/48.0.1/ckeditor5.umd.js" crossorigin></script>
    <script src="./main.js"></script>
  </body>
</html>
